<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- PIXEL PING — pixel-art sonar logo (original) -->
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#040914"/>
    </linearGradient>
    <linearGradient id="pp-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="pp-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pp-bg)" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- sonar diamond pixel rings, center (28,38) -->
  <g fill="url(#pp-ring)" filter="url(#pp-glow)">
    <!-- outer ring r=19 -->
    <g opacity="0.28">
      <rect x="26" y="15" width="4" height="4" rx="0.6"/>
      <rect x="43" y="36" width="4" height="4" rx="0.6"/>
      <rect x="26" y="57" width="4" height="4" rx="0.6"/>
      <rect x="9"  y="36" width="4" height="4" rx="0.6"/>
      <!-- diagonal corner accents -->
      <rect x="37" y="22" width="4" height="4" rx="0.6"/>
      <rect x="37" y="50" width="4" height="4" rx="0.6"/>
      <rect x="15" y="22" width="4" height="4" rx="0.6"/>
      <rect x="15" y="50" width="4" height="4" rx="0.6"/>
    </g>
    <!-- mid ring r=13 -->
    <g opacity="0.55">
      <rect x="26" y="21" width="4" height="4" rx="0.6"/>
      <rect x="39" y="36" width="4" height="4" rx="0.6"/>
      <rect x="26" y="51" width="4" height="4" rx="0.6"/>
      <rect x="13" y="36" width="4" height="4" rx="0.6"/>
    </g>
    <!-- inner ring r=7 -->
    <g opacity="0.85">
      <rect x="26" y="27" width="4" height="4" rx="0.6"/>
      <rect x="33" y="36" width="4" height="4" rx="0.6"/>
      <rect x="26" y="45" width="4" height="4" rx="0.6"/>
      <rect x="19" y="36" width="4" height="4" rx="0.6"/>
    </g>
  </g>

  <!-- core ping dot -->
  <rect x="24" y="34" width="8" height="8" rx="1.6" fill="#93c5fd" filter="url(#pp-glow)"/>

  <!-- pixel corner accents -->
  <g fill="#2563eb" opacity="0.85">
    <rect x="9" y="9" width="3" height="3"/>
    <rect x="13" y="9" width="3" height="3"/>
    <rect x="9" y="13" width="3" height="3"/>
  </g>
  <g fill="#60a5fa" opacity="0.65">
    <rect x="52" y="52" width="3" height="3"/>
    <rect x="48" y="52" width="3" height="3"/>
    <rect x="52" y="48" width="3" height="3"/>
  </g>
</svg>
